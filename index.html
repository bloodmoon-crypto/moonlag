<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Generated | Unknown Modz</title>
    <style>
        :root { --bg: #000000; --card: #121212; --text: #ffffff; --accent: #00ff88; --error: #ff4444; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { width: 100%; max-width: 400px; text-align: center; margin-top: 50px; }
        #mainContainer { display: none; }
        #bypassContainer { display: none; }
        .error-card { background: #1a0a0a; border: 1px solid #441111; border-radius: 28px; padding: 40px 30px; box-shadow: 0 10px 40px rgba(255,0,0,0.1); }
        .error-icon { font-size: 50px; margin-bottom: 20px; }
        .error-title { color: var(--error); font-size: 24px; font-weight: bold; margin-bottom: 15px; }
        .key-icon { background: #1a1a1a; width: 85px; height: 85px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: -45px auto 15px; border: 1px solid #333; overflow: hidden; box-shadow: 0 0 25px rgba(0, 255, 136, 0.1); position: relative; z-index: 10; }
        h1 { font-size: 28px; font-weight: bold; margin-bottom: 8px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }
        .card { background: var(--card); border: 1px solid #222; border-radius: 28px; padding: 40px 30px 30px; text-align: center; box-shadow: 0 15px 50px rgba(0,0,0,0.6); position: relative; }
        h2 { font-size: 22px; margin-bottom: 12px; color: var(--accent); font-weight: 700; }
        .key-box { background: #000; padding: 22px; border-radius: 18px; border: 1px dashed var(--accent); margin-bottom: 25px; }
        #finalKey { color: var(--accent); font-family: 'Courier New', monospace; font-size: 19px; font-weight: bold; letter-spacing: 1px; }
        .btn { width: 100%; padding: 18px; background: #ffffff; color: #000; border: none; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer; }
        .btn-red { background: var(--error); color: white; margin-top: 20px; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #333; background: #1a1a1a; color: white; text-align: center; font-size: 16px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div id="mainContainer">
        <h1>Device Lock System</h1>
        <p class="subtitle">Enter the Device ID shown in the app.</p>
        <div class="card">
            <h2>24h License Generator</h2>
            <input type="text" id="deviceIdInput" placeholder="Paste Device ID Here">
            <button class="btn" onclick="generateKey()">GENERATE KEY</button>
            <div class="key-box" style="margin-top:20px;">
                <span id="finalKey">WAITING...</span>
            </div>
            <button class="btn" id="copyBtn" onclick="copyKey()" style="display:none;">COPY TO CLIPBOARD</button>
        </div>
    </div>

    <div id="bypassContainer">
        <div class="error-card">
            <div class="error-icon">🚫</div>
            <div class="error-title">Bypass Detected!</div>
            <p style="color:#888; font-size: 14px;">Direct access is prohibited. Please use the official link from the script to generate your key.</p>
            <button class="btn btn-red" onclick="location.href='steps.html'">RETURN TO STEPS</button>
        </div>
    </div>
</div>

<script>
    function checkSecurity() {
        const urlOk = new URLSearchParams(location.search).get('v') === '1';
        if (urlOk) {
            document.getElementById('mainContainer').style.display = "block";
            document.getElementById('bypassContainer').style.display = "none";
            history.replaceState({}, '', location.pathname);
        } else {
            document.getElementById('bypassContainer').style.display = "block";
        }
    }

    function generateKey() {
        const devId = document.getElementById('deviceIdInput').value.trim();
        if (!devId || devId.length < 5) {
            alert("Please paste your Device ID");
            return;
        }

        // Java String.hashCode() simulation
        let hash = 0;
        for (let i = 0; i < devId.length; i++) {
            hash = ((hash << 5) - hash) + devId.charCodeAt(i);
            hash |= 0; // Convert to 32bit integer
        }

        const day = Math.floor(Date.now() / 86400000);
        let seed = (hash + day + 0x7EA) | 0;

        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let key = "UKM-";

        for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 4; j++) {
                seed = Math.imul(seed, 0x41C64E6D) + 0x3039;
                seed = (seed & 0x7FFFFFFF) | 0;
                let idx = seed % 32;
                if (idx < 0) idx += 32;
                key += chars[idx];
            }
            if (i < 3) key += '-';
        }

        document.getElementById('finalKey').innerText = key;
        document.getElementById('copyBtn').style.display = "block";
    }

    function copyKey() {
        const keyText = document.getElementById('finalKey').innerText;
        if (!keyText.startsWith('UKM-')) return;
        navigator.clipboard.writeText(keyText).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "COPIED SUCCESSFULLY! ✅";
            setTimeout(() => { btn.innerText = "COPY TO CLIPBOARD"; }, 2000);
        });
    }

    window.onload = checkSecurity;
</script>
</body>
</html>
